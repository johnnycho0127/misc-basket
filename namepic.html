<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Profile & Name Memo Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 12px !important;
      }
      .card-box {
        break-inside: avoid;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
      }
      .mask-active .hide-on-quiz { display: block !important; opacity: 1 !important; filter: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 text-white py-4 px-6 shadow-md no-print">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-id-card text-indigo-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Name Memo Studio</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="quiz-toggle" onclick="toggleQuizMode()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-lg border border-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-eye-slash text-amber-400"></i>
          <span>Quiz Mode: OFF</span>
        </button>
        <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i>
          <span>Print / Save PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    
    <!-- IMPORT CONTROLS -->
    <section class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-slate-200 no-print">
      <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-file-import text-indigo-600"></i> Import Roster Data
      </h2>

      <!-- TABS -->
      <div class="flex border-b border-slate-200 mb-4">
        <button onclick="switchTab('url')" id="tab-btn-url" class="py-2 px-4 border-b-2 border-indigo-600 text-indigo-600 font-medium text-sm">Fetch Web Page</button>
        <button onclick="switchTab('html')" id="tab-btn-html" class="py-2 px-4 text-slate-500 font-medium text-sm">Paste HTML / Text</button>
        <button onclick="switchTab('files')" id="tab-btn-files" class="py-2 px-4 text-slate-500 font-medium text-sm">Upload Photos / Files</button>
      </div>

      <!-- TAB 1: LIVE URL FETCH -->
      <div id="tab-url" class="tab-content">
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="url" id="scrape-url" placeholder="https://www.southalabama.edu/colleges/ceps/cins-faculty.html" class="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="fetchFromUrl()" class="px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-compass"></i> Extract Profiles
          </button>
        </div>
        <p class="text-xs text-slate-500 mt-2">Fetches images and text through secure CORS proxy gateways automatically.</p>
      </div>

      <!-- TAB 2: PASTE HTML -->
      <div id="tab-html" class="tab-content hidden">
        <textarea id="raw-html-input" rows="4" placeholder="Right click on faculty webpage -> View Source or Copy DOM HTML and paste here..." class="w-full p-3 border border-slate-300 rounded-lg text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <div class="flex justify-between items-center mt-3">
          <input type="text" id="baseUrlInput" placeholder="Base URL for photos (e.g. https://www.southalabama.edu)" class="px-3 py-1.5 text-xs border border-slate-300 rounded w-1/2">
          <button onclick="parseRawHTML()" class="px-5 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">
            Parse HTML Snippet
          </button>
        </div>
      </div>

      <!-- TAB 3: FILE UPLOAD -->
      <div id="tab-files" class="tab-content hidden">
        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer" onclick="document.getElementById('file-input').click()">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500 mb-2"></i>
          <p class="text-sm font-medium text-slate-700">Click to upload photos, CSV, or JSON roster files</p>
          <p class="text-xs text-slate-400 mt-1">Image filenames like "John_Doe_Professor.jpg" will be auto-parsed into profiles</p>
          <input type="file" id="file-input" multiple accept="image/*,.csv,.json" class="hidden" onchange="handleFileUpload(event)">
        </div>
      </div>
    </section>

    <!-- ROSTER ACTIONS BAR -->
    <div class="flex justify-between items-center mb-6 no-print">
      <div class="text-sm text-slate-600 font-semibold">
        Profiles Loaded: <span id="profile-count" class="text-indigo-600">0</span>
      </div>
      <div class="flex gap-2">
        <button onclick="addEmptyProfile()" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-medium rounded-md shadow-sm transition">
          <i class="fa-solid fa-user-plus mr-1"></i> Add Single
        </button>
        <button onclick="clearRoster()" class="px-3 py-1.5 bg-white border border-red-200 hover:bg-red-50 text-red-600 text-xs font-medium rounded-md shadow-sm transition">
          <i class="fa-solid fa-trash-can mr-1"></i> Clear All
        </button>
      </div>
    </div>

    <!-- PROFILE GRID CONTAINER -->
    <div id="profile-grid" class="print-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamic profile cards load here -->
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let profiles = [];
    let isQuizActive = false;

    // BASE SVG AVATAR IF NO PHOTO FOUND
    function generatePlaceholder(name) {
      const initials = name ? name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase() : '??';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="bold" fill="#64748b">${initials}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // NORMALIZATION UTILITY FOR RELATIVE URLS
    function makeAbsoluteUrl(relativeUrl, baseUrl) {
      if (!relativeUrl) return '';
      if (relativeUrl.startsWith('data:') || relativeUrl.startsWith('http://') || relativeUrl.startsWith('https://')) {
        return relativeUrl;
      }
      try {
        const base = new URL(baseUrl);
        return new URL(relativeUrl, base.origin + base.pathname).href;
      } catch (e) {
        return relativeUrl;
      }
    }

    // MAIN URL SCRAPER WITH CORS PROXIES
    async function fetchFromUrl() {
      const urlInput = document.getElementById('scrape-url').value.trim();
      if (!urlInput) return alert('Please enter a directory page URL');

      const proxies = [
        (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        (u) => `https://thingproxy.freeboard.io/fetch/${u}`
      ];

      let htmlText = '';
      for (const proxyFn of proxies) {
        try {
          const proxyUrl = proxyFn(urlInput);
          const res = await fetch(proxyUrl);
          if (!res.ok) continue;
          
          if (proxyUrl.includes('allorigins')) {
            const data = await res.json();
            htmlText = data.contents;
          } else {
            htmlText = await res.text();
          }

          if (htmlText && htmlText.length > 200) break;
        } catch (e) {
          console.warn('Proxy retry failed, trying next...');
        }
      }

      if (!htmlText) {
        alert('Could not fetch live URL automatically due to site protection. Please copy page content and use the "Paste HTML / Text" tab!');
        return;
      }

      parseDOMContent(htmlText, urlInput);
    }

    // DOM PARSER ENGINE
    function parseDOMContent(htmlString, pageUrl) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      const newProfiles = [];

      // Check table rows first (common for USA and college faculty lists)
      const rows = doc.querySelectorAll('tr');
      if (rows.length > 1) {
        rows.forEach(row => {
          const img = row.querySelector('img');
          const textContent = row.textContent.trim();
          
          // Filter out global headers/footers
          if (textContent.includes('Search USA') || textContent.includes('A-Z Index')) return;

          let imgSrc = img ? (img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('srcset')) : '';
          imgSrc = makeAbsoluteUrl(imgSrc, pageUrl);

          const links = row.querySelectorAll('a');
          let name = '';
          links.forEach(a => {
            const txt = a.textContent.trim();
            if (txt && !txt.includes('@') && !txt.includes('(') && txt.length > 3 && !name) {
              name = txt;
            }
          });

          if (name) {
            // Reformat "LastName, FirstName" -> "FirstName LastName"
            if (name.includes(',')) {
              const parts = name.split(',');
              name = `${parts[1].trim()} ${parts[0].trim()}`;
            }

            const titleMatch = row.innerText.match(/(Assistant Professor|Associate Professor|Professor|Secretary|Lecturer|Chair|Instructor)[^\n]*/i);
            const title = titleMatch ? titleMatch[0].trim() : 'Faculty / Staff Member';

            newProfiles.push({
              id: Date.now() + Math.random(),
              name: name,
              title: title,
              image: imgSrc || generatePlaceholder(name),
              notes: ''
            });
          }
        });
      }

      // Fallback for card/grid elements if no table rows matched
      if (newProfiles.length === 0) {
        const cards = doc.querySelectorAll('.faculty, .profile, .directory-item, .person, article');
        cards.forEach(card => {
          const img = card.querySelector('img');
          const nameEl = card.querySelector('h2, h3, h4, .name, strong');
          if (nameEl) {
            let imgSrc = img ? (img.getAttribute('src') || img.getAttribute('data-src')) : '';
            imgSrc = makeAbsoluteUrl(imgSrc, pageUrl);
            newProfiles.push({
              id: Date.now() + Math.random(),
              name: nameEl.textContent.trim(),
              title: 'Faculty / Staff Member',
              image: imgSrc || generatePlaceholder(nameEl.textContent.trim()),
              notes: ''
            });
          }
        });
      }

      if (newProfiles.length > 0) {
        profiles = [...profiles, ...newProfiles];
        renderRoster();
      } else {
        alert('No profiles could be extracted automatically. Try pasting HTML content directly in Tab 2.');
      }
    }

    // PASTE HTML HANDLER
    function parseRawHTML() {
      const raw = document.getElementById('raw-html-input').value;
      const baseUrl = document.getElementById('baseUrlInput').value || 'https://www.southalabama.edu';
      if (!raw) return alert('Please paste HTML content first');
      parseDOMContent(raw, baseUrl);
    }

    // FILE UPLOAD HANDLER
    function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            profiles.push({
              id: Date.now() + Math.random(),
              name: cleanName,
              title: 'Uploaded Profile',
              image: e.target.result,
              notes: ''
            });
            renderRoster();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // RENDER ROSTER CARDS
    function renderRoster() {
      const grid = document.getElementById('profile-grid');
      document.getElementById('profile-count').textContent = profiles.length;
      grid.innerHTML = '';

      if (profiles.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400">
            <i class="fa-solid fa-id-card-clip text-5xl mb-3"></i>
            <p class="text-base font-medium">No profiles loaded yet</p>
            <p class="text-xs">Fetch a directory page or upload photos above to get started.</p>
          </div>
        `;
        return;
      }

      profiles.forEach(p => {
        const card = document.createElement('div');
        card.className = `card-box bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col ${isQuizActive ? 'mask-active' : ''}`;
        card.innerHTML = `
          <div class="relative w-full aspect-square bg-slate-100 overflow-hidden">
            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover object-top" onerror="this.src='${generatePlaceholder(p.name)}'">
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-slate-900 text-base leading-snug hide-on-quiz cursor-pointer" onclick="toggleSingleMask(this)">
                ${p.name}
              </h3>
              <p class="text-xs text-slate-500 mt-1 hide-on-quiz">${p.title}</p>
            </div>
            <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400 no-print">
              <span class="truncate max-w-[150px]">${p.notes || 'No notes'}</span>
              <div class="flex gap-2">
                <button onclick="editProfile('${p.id}')" class="hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteProfile('${p.id}')" class="hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // QUIZ / STUDY MASK TOGGLE
    function toggleQuizMode() {
      isQuizActive = !isQuizActive;
      const btn = document.getElementById('quiz-toggle');
      btn.querySelector('span').textContent = `Quiz Mode: ${isQuizActive ? 'ON' : 'OFF'}`;
      btn.className = isQuizActive 
        ? "px-4 py-2 bg-amber-500 text-white text-sm font-semibold rounded-lg shadow transition flex items-center gap-2"
        : "px-4 py-2 bg-slate-800 text-slate-200 text-sm font-semibold rounded-lg border border-slate-700 hover:bg-slate-700 transition flex items-center gap-2";
      renderRoster();
    }

    function toggleSingleMask(el) {
      if (isQuizActive) {
        el.classList.toggle('opacity-0');
      }
    }

    function addEmptyProfile() {
      const name = prompt('Enter Name:');
      if (!name) return;
      const title = prompt('Enter Position / Role:', 'Faculty');
      profiles.push({
        id: Date.now(),
        name: name,
        title: title || 'Staff Member',
        image: generatePlaceholder(name),
        notes: ''
      });
      renderRoster();
    }

    function editProfile(id) {
      const p = profiles.find(item => item.id == id);
      if (!p) return;
      const name = prompt('Edit Name:', p.name);
      if (name !== null) p.name = name;
      const title = prompt('Edit Position:', p.title);
      if (title !== null) p.title = title;
      renderRoster();
    }

    function deleteProfile(id) {
      profiles = profiles.filter(p => p.id != id);
      renderRoster();
    }

    function clearRoster() {
      if (confirm('Are you sure you want to clear all loaded profiles?')) {
        profiles = [];
        renderRoster();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
    }

    // Initial render
    renderRoster();
  </script>
</body>
</html>
